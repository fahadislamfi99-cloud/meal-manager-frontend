<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Directory | SaaS Control Room</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; overflow-x: hidden; }
        .sidebar { width: 260px; background-color: #0f172a; color: #94a3b8; height: 100vh; position: fixed; top: 0; left: 0; transition: 0.3s ease; z-index: 1050; }
        .sidebar-brand { padding: 24px; font-size: 1.25rem; font-weight: 800; color: #ffffff; border-bottom: 1px solid #1e293b; letter-spacing: -0.5px; }
        .nav-link { color: #94a3b8; padding: 12px 24px; font-weight: 500; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background-color: #1e293b; border-right: 4px solid #6366f1; }
        .main-content { margin-left: 260px; padding: 30px; transition: 0.3s ease; min-height: 100vh; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); z-index: 1040; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .table-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 24px; border: 1px solid #e2e8f0; }
        .btn-action { padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; }
        
        /* Table Styles */
        .table thead th { background: #f8fafc; color: #475569; font-weight: 600; border-bottom: 2px solid #e2e8f0; font-size: 0.85rem; text-transform: uppercase; padding: 12px 16px;}
        .table tbody td { padding: 16px; vertical-align: middle; color: #334155; font-weight: 500; border-bottom: 1px solid #f1f5f9; }

        @media (max-width: 991.98px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .sidebar-overlay.show { display: block; opacity: 1; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand d-flex justify-content-between align-items-center">
            <span><i class="bi bi-shield-lock-fill me-2" style="color: #6366f1;"></i> Super Admin</span>
            <i class="bi bi-x-lg d-lg-none" id="close-sidebar" style="cursor: pointer; color: #64748b;"></i>
        </div>
        <div class="mt-4">
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i> Overview</a>
            <a href="directory.html" class="nav-link active"><i class="bi bi-buildings-fill"></i> Mess Directory</a>
            <a href="coupons.html" class="nav-link"><i class="bi bi-tags-fill"></i> Coupons & Promos</a>
            <a href="transactions.html" class="nav-link"><i class="bi bi-receipt"></i> Transactions</a>
            <a href="#" class="nav-link text-danger mt-5" id="logout-btn"><i class="bi bi-box-arrow-left"></i> Secure Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex align-items-center mb-4 d-lg-none">
            <button class="btn btn-dark border-0 rounded-3 shadow-sm me-3" id="mobile-toggler" style="background-color: #0f172a;"><i class="bi bi-list fs-4"></i></button>
            <h4 class="fw-bold mb-0 text-dark">Mess Directory</h4>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0 text-dark">All Messes Directory</h3>
                <p class="text-muted small mb-0">Manage all registered clients from here.</p>
            </div>
        </div>

        <div class="table-card p-3 p-md-4">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="full-directory-table" style="min-width: 800px;">
                    <thead>
                        <tr>
                            <th>Mess Name</th>
                            <th>Manager Email</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const mobileToggler = document.getElementById('mobile-toggler');
        const closeSidebarBtn = document.getElementById('close-sidebar');

        function openSidebar() { sidebar.classList.add('show'); overlay.classList.add('show'); }
        function closeSidebar() { sidebar.classList.remove('show'); overlay.classList.remove('show'); }
        
        if(mobileToggler) mobileToggler.addEventListener('click', openSidebar);
        if(closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeSidebar);
        if(overlay) overlay.addEventListener('click', closeSidebar);
    </script>
    <script src="admin.js"></script>
</body>
</html>
