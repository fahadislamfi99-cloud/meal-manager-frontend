<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login | Mess Manager</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Premium Dark Background */
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 🌌 Animated Background Glow */
        .glow-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(15,23,42,0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 1;
            position: relative;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #6366f1; /* Indigo */
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
        }

        .form-control:focus {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-login {
            background-color: #6366f1;
            color: white;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-login:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        ::placeholder { color: #64748b !important; }
    </style>
</head>
<body>

    <div class="glow-circle"></div>

    <div class="login-card text-center">
        <div class="brand-icon">
            <i class="bi bi-fingerprint"></i>
        </div>
        <h3 class="fw-bold mb-1">HQ Access</h3>
        <p class="text-muted small mb-4">Super Admin Control Panel</p>

        <form id="admin-login-form">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-secondary">Admin Username</label>
                <input type="text" id="admin-user" class="form-control" placeholder="Enter username" required autocomplete="off">
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold text-secondary">Secret Passcode</label>
                <input type="password" id="admin-pass" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login"><i class="bi bi-shield-lock-fill me-2"></i> Authenticate</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'https://meal-manager-backend-kp8y.onrender.com/api';

        // যদি আগে থেকেই লগিন করা থাকে, তাহলে সরাসরি ড্যাশবোর্ডে পাঠিয়ে দেবে
        if (localStorage.getItem('superAdminToken')) {
            window.location.replace('dashboard.html');
        }

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    // লগিন সফল হলে টোকেন সেভ করে ড্যাশবোর্ডে রিডাইরেক্ট করবে
                    localStorage.setItem('superAdminToken', data.token);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Access Granted!',
                        text: data.message,
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.replace('dashboard.html');
                    });
                } else {
                    Swal.fire('Access Denied', data.message || 'ভুল ইউজারনেম বা পাসওয়ার্ড!', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'সার্ভারে কানেক্ট করা যাচ্ছে না!', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
